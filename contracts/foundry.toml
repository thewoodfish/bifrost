[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
optimizer = true
optimizer_runs = 200
via_ir = true
solc_version = "0.8.24"
evm_version = "london"   # CC3 testnet rejects paris+ (no prevrandao); london is portable to both chains
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
